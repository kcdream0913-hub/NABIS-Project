name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck, build, unit tests
    runs-on: ubuntu-latest
    env:
      # Build reads these (NEXT_PUBLIC_* are inlined at build time). Configured as
      # repo Actions secrets; the app also tolerates their absence at build (the
      # client is only constructed at request time), but keeping them set mirrors
      # the Vercel build environment.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` requires package-lock.json to be in sync with package.json for
      # the SAME npm major it runs under (Node 22 ships npm 10). The lockfile is
      # kept cross-compatible with npm 10 and 11 — if this step ever fails with
      # "Missing: <pkg> from lock file", run `npm install` locally and commit the
      # updated lockfile.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

  e2e:
    name: Playwright E2E (smoke + authenticated)
    runs-on: ubuntu-latest
    needs: unit
    concurrency:
      # Constant group (deliberately NO ${{ github.ref }}). BL-E2E-SPLIT-01 (D-085): the suite no
      # longer touches PROD, so this no longer blocks unrelated prod work — but it is KEPT, not
      # dropped, because WITHIN the dedicated E2E project the suite still shares one account A and
      # one THREAD_AB, and global-teardown deletes A's whole uploader subtree + tombstones A's
      # messages inside a window; two concurrent runs would corrupt each other. Serializing E2E
      # runs among themselves is the cheap fix; per-ref PARALLELISM would need the run-scoped
      # object/message prefixes D-062 describes (deferred). One e2e run at a time, repo-wide.
      group: e2e
      # Cancelling an in-flight e2e job skips global-teardown, leaving residue (D-060).
      cancel-in-progress: false
      # `queue` defaults to `single` (a THIRD run cancels the pending one — a merge train would
      # silently lose a run). `max` allows up to 100 pending.
      queue: max
    env:
      # BL-E2E-SPLIT-01 (D-085): the E2E suite runs against a DEDICATED Supabase project
      # (sangamline-e2e), NOT prod, so a run can never pollute real members' feeds/DMs/storage.
      # These point at the E2E project; the `unit` job KEEPS the prod NEXT_PUBLIC_* values (build
      # parity with Vercel). Set E2E_SUPABASE_URL / E2E_SUPABASE_ANON_KEY as new repo secrets, and
      # update E2E_EMAIL / E2E_PASSWORD / E2E_FOREIGN_ATTACHMENT_PATH to the E2E project's seeded
      # values (see scripts/seed-e2e.mjs output).
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      # Authenticated suites (social + attachments) run against E2E account A; without these they
      # SKIP. Seeded by scripts/seed-e2e.mjs against the E2E project.
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_FOREIGN_ATTACHMENT_PATH: ${{ secrets.E2E_FOREIGN_ATTACHMENT_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check secrets are actually present (never prints values)
        run: |
          fail=0
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY E2E_EMAIL E2E_PASSWORD E2E_FOREIGN_ATTACHMENT_PATH; do
            val="${!name}"
            if [ -z "$val" ]; then echo "::error::$name is EMPTY/MISSING"; fail=1; else echo "$name is set, length ${#val}"; fi
          done
          [ "$fail" = 0 ] || exit 1
      - run: npx playwright install --with-deps chromium
      # The feed-media fixtures (BL-SOCIAL-03a: img1/img2.jpg, short.mp4, big.mp4) are
      # built with ffmpeg at globalSetup; gen-e2e-fixtures.mjs fails loudly if it is
      # missing. ffmpeg ships in the ubuntu-latest image, but install it explicitly so
      # the suite never depends on undocumented image contents.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Playwright's webServer builds the app and runs `next start`. The smoke suite
      # runs unauthenticated; feed-media + attachments authenticate as account A. All
      # E2E fixtures are generated by globalSetup (scripts/gen-e2e-fixtures.mjs).
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
