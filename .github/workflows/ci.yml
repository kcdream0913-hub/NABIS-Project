name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck, build, unit tests
    runs-on: ubuntu-latest
    env:
      # Build reads these (NEXT_PUBLIC_* are inlined at build time). Configured as
      # repo Actions secrets; the app also tolerates their absence at build (the
      # client is only constructed at request time), but keeping them set mirrors
      # the Vercel build environment.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` requires package-lock.json to be in sync with package.json for
      # the SAME npm major it runs under (Node 22 ships npm 10). The lockfile is
      # kept cross-compatible with npm 10 and 11 — if this step ever fails with
      # "Missing: <pkg> from lock file", run `npm install` locally and commit the
      # updated lockfile.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

  e2e:
    name: Playwright E2E (smoke + authenticated)
    runs-on: ubuntu-latest
    needs: unit
    concurrency:
      # Constant group (deliberately NO ${{ github.ref }}): the suite writes to PROD
      # as the single seeded account A and its teardown deletes A's WHOLE uploader
      # subtree under THREAD_AB. One e2e job at a time, repo-wide, across every ref.
      group: e2e-prod
      # Cancelling an in-flight e2e job skips global-teardown, leaving exactly the
      # prod residue this is meant to prevent (D-060).
      cancel-in-progress: false
      # `queue` defaults to `single`, under which a THIRD run cancels the pending
      # job rather than queuing it — a merge train would silently lose a run. `max`
      # allows up to 100 pending.
      queue: max
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Authenticated suites (social + attachments) run against the hub-seeded pilot
      # account A; without these they SKIP. Set as repo Actions secrets.
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_FOREIGN_ATTACHMENT_PATH: ${{ secrets.E2E_FOREIGN_ATTACHMENT_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check secrets are actually present (never prints values)
        run: |
          fail=0
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY E2E_EMAIL E2E_PASSWORD E2E_FOREIGN_ATTACHMENT_PATH; do
            val="${!name}"
            if [ -z "$val" ]; then echo "::error::$name is EMPTY/MISSING"; fail=1; else echo "$name is set, length ${#val}"; fi
          done
          [ "$fail" = 0 ] || exit 1
      - run: npx playwright install --with-deps chromium
      # The feed-media fixtures (BL-SOCIAL-03a: img1/img2.jpg, short.mp4, big.mp4) are
      # built with ffmpeg at globalSetup; gen-e2e-fixtures.mjs fails loudly if it is
      # missing. ffmpeg ships in the ubuntu-latest image, but install it explicitly so
      # the suite never depends on undocumented image contents.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Playwright's webServer builds the app and runs `next start`. The smoke suite
      # runs unauthenticated; feed-media + attachments authenticate as account A. All
      # E2E fixtures are generated by globalSetup (scripts/gen-e2e-fixtures.mjs).
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  policy-lint:
    name: Column-blind write lint (RLS)
    runs-on: ubuntu-latest
    # DORMANT until the E2E baseline lands (BL-E2E-SPLIT-01 / D-085). The lint must run against a
    # PROD-EQUIVALENT schema; a local `supabase db start` only reproduces prod once the baseline dump
    # is committed. Against today's incomplete migrations it would give false results, so the `gate`
    # step below activates the real work only once the baseline file exists — not before.
    # (`hashFiles` can't gate at the JOB level — it evaluates before checkout — so the gate is a
    # step that sets an output.) NOTE: this harness is UNTESTED until it activates (GitHub Actions
    # can't run in the dev sandbox); the lint + positive-control SQL are proven against prod (D-088).
    steps:
      - uses: actions/checkout@v4
      - id: gate
        # Date-independent: match the baseline by its fixed 00000000000001_baseline_ prefix, NOT a
        # hardcoded date. A pinned date (…_2026_08_04.sql) would never match the real file
        # (…_2026_08_05.sql) → the gate stays false and policy-lint passes green forever, dormant.
        run: |
          if ls supabase/migrations/00000000000001_baseline_*.sql >/dev/null 2>&1; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "baseline not committed yet — policy-lint is dormant (BL-E2E-SPLIT-01 / D-085)"
          fi
      - if: steps.gate.outputs.active == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.gate.outputs.active == 'true'
        name: Start a local Postgres reproduced from the baseline
        run: supabase db start
      - if: steps.gate.outputs.active == 'true'
        name: Positive control — the lint MUST detect a known-bad table, or the lint is broken (D-058)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/lint/column_blind_writes.control.sql
      - if: steps.gate.outputs.active == 'true'
        name: Lint — fail the job if any table has a column-blind write policy
        run: |
          rows=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -t -A -f supabase/lint/column_blind_writes.sql)
          if [ -n "$rows" ]; then
            echo "::error::column-blind write policy found — guard it (BEFORE INSERT trigger / drop the policy) or allow-list it with a reason in supabase/lint/column_blind_writes.sql:"
            echo "$rows"
            exit 1
          fi
          echo "column-blind write lint: clean (0 rows)"
